<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Engine Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #FAFAFA; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: #0A0A0A; border: 1px solid #1F1F1F; border-radius: 12px; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <span class="text-2xl text-yellow-500">⚜️</span>
            <h1 class="text-xl font-bold tracking-widest">TWIN ENGINE TERMINAL</h1>
        </div>
        <div id="market-status" class="text-xs font-bold px-3 py-1 rounded bg-gray-900 text-gray-400 border border-gray-800">
            LOADING...
        </div>
    </div>

    <!-- Live Price Card -->
    <div class="glass p-6 mb-6 flex justify-between items-center">
        <div>
            <p class="text-xs text-gray-500 font-semibold mb-1">INSTRUMENT</p>
            <h2 class="text-2xl font-bold">XAUUSD</h2>
        </div>
        <div class="text-right">
            <p class="text-xs text-gray-500 font-semibold mb-1">LIVE PRICE</p>
            <h2 id="live-price" class="text-3xl mono text-green-400">---.--</h2>
        </div>
    </div>

    <!-- Engine Grids -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        
        <!-- ENGINE 1 -->
        <div class="glass p-6 border-t-2 border-t-blue-500">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="text-lg font-bold text-white">ENGINE 1: T4F</h3>
                    <p class="text-xs text-gray-500">08:03 & 14:45 WAT</p>
                </div>
                <div id="e1-status" class="text-xs font-bold px-2 py-1 rounded bg-gray-900 text-gray-400">WAITING</div>
            </div>
            <div id="e1-signal" class="hidden">
                <div id="e1-type" class="text-2xl font-black mb-2"></div>
                <div class="space-y-2 text-sm mono">
                    <div class="flex justify-between"><span class="text-gray-500">ENTRY</span> <span id="e1-entry"></span></div>
                    <div class="flex justify-between"><span class="text-gray-500">SL</span> <span id="e1-sl" class="text-red-500"></span></div>
                    <div class="flex justify-between"><span class="text-gray-500">TP1</span> <span id="e1-tp1" class="text-green-500"></span></div>
                    <div class="flex justify-between"><span class="text-gray-500">TP2</span> <span id="e1-tp2" class="text-green-500"></span></div>
                    <div class="flex justify-between"><span class="text-gray-500">TP3</span> <span id="e1-tp3" class="text-green-500"></span></div>
                </div>
            </div>
            <div id="e1-reason" class="text-xs text-yellow-500 mt-4">Initializing...</div>
        </div>

        <!-- ENGINE 2 -->
        <div class="glass p-6 border-t-2 border-t-yellow-500">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="text-lg font-bold text-white">ENGINE 2: ASIA</h3>
                    <p class="text-xs text-gray-500">Asia Sweep + CHoCH</p>
                </div>
                <div id="e2-status" class="text-xs font-bold px-2 py-1 rounded bg-gray-900 text-gray-400">WAITING</div>
            </div>
            <div id="e2-signal" class="hidden">
                <div id="e2-type" class="text-2xl font-black mb-2"></div>
                <div class="space-y-2 text-sm mono">
                    <div class="flex justify-between"><span class="text-gray-500">ENTRY</span> <span id="e2-entry"></span></div>
                    <div class="flex justify-between"><span class="text-gray-500">SL</span> <span id="e2-sl" class="text-red-500"></span></div>
                    <div class="flex justify-between"><span class="text-gray-500">TP1</span> <span id="e2-tp1" class="text-green-500"></span></div>
                    <div class="flex justify-between"><span class="text-gray-500">TP2</span> <span id="e2-tp2" class="text-green-500"></span></div>
                    <div class="flex justify-between"><span class="text-gray-500">TP3</span> <span id="e2-tp3" class="text-green-500"></span></div>
                </div>
            </div>
            <div id="e2-reason" class="text-xs text-yellow-500 mt-4">Initializing...</div>
        </div>

    </div>

    <script>
        async function fetchSignal() {
            try {
                // Add a timestamp to prevent browser caching
                const res = await fetch('/api/scan?t=' + new Date().getTime());
                const data = await res.json();
                
                if(!data.ok) return;

                // Update Top Header
                document.getElementById('live-price').innerText = data.price.toFixed(2);
                const marketEl = document.getElementById('market-status');
                if(data.session.active) {
                    marketEl.innerText = 'MARKET OPEN';
                    marketEl.className = 'text-xs font-bold px-3 py-1 rounded bg-green-900/30 text-green-400 border border-green-900';
                } else {
                    marketEl.innerText = 'MARKET CLOSED';
                    marketEl.className = 'text-xs font-bold px-3 py-1 rounded bg-red-900/30 text-red-400 border border-red-900';
                }

                // Update Engine 1 (T4F)
                const e1 = data.engines.t4f;
                if(e1.signal !== 'WAITING') {
                    document.getElementById('e1-signal').classList.remove('hidden');
                    document.getElementById('e1-status').innerText = 'ACTIVE';
                    document.getElementById('e1-status').className = 'text-xs font-bold px-2 py-1 rounded bg-green-900/50 text-green-400';
                    document.getElementById('e1-type').innerText = e1.signal;
                    document.getElementById('e1-type').className = e1.signal === 'BUY' ? 'text-2xl font-black mb-2 text-green-500' : 'text-2xl font-black mb-2 text-red-500';
                    document.getElementById('e1-entry').innerText = e1.entry;
                    document.getElementById('e1-sl').innerText = e1.stopLoss;
                    document.getElementById('e1-tp1').innerText = e1.tp1;
                    document.getElementById('e1-tp2').innerText = e1.tp2;
                    document.getElementById('e1-tp3').innerText = e1.tp3;
                } else {
                    document.getElementById('e1-signal').classList.add('hidden');
                    document.getElementById('e1-status').innerText = 'WAITING';
                    document.getElementById('e1-status').className = 'text-xs font-bold px-2 py-1 rounded bg-gray-900 text-gray-400';
                }
                document.getElementById('e1-reason').innerText = e1.reason;

                // Update Engine 2 (Asia Sweep)
                const e2 = data.engines.asia;
                if(e2.signal !== 'WAITING') {
                    document.getElementById('e2-signal').classList.remove('hidden');
                    document.getElementById('e2-status').innerText = 'ACTIVE';
                    document.getElementById('e2-status').className = 'text-xs font-bold px-2 py-1 rounded bg-green-900/50 text-green-400';
                    document.getElementById('e2-type').innerText = e2.signal;
                    document.getElementById('e2-type').className = e2.signal === 'BUY' ? 'text-2xl font-black mb-2 text-green-500' : 'text-2xl font-black mb-2 text-red-500';
                    document.getElementById('e2-entry').innerText = e2.entry;
                    document.getElementById('e2-sl').innerText = e2.stopLoss;
                    document.getElementById('e2-tp1').innerText = e2.tp1;
                    document.getElementById('e2-tp2').innerText = e2.tp2;
                    document.getElementById('e2-tp3').innerText = e2.tp3;
                } else {
                    document.getElementById('e2-signal').classList.add('hidden');
                    document.getElementById('e2-status').innerText = 'WAITING';
                    document.getElementById('e2-status').className = 'text-xs font-bold px-2 py-1 rounded bg-gray-900 text-gray-400';
                }
                document.getElementById('e2-reason').innerText = e2.reason;

            } catch (e) {
                console.error("Error fetching data:", e);
            }
        }
        
        // Fetch immediately, then every 10 seconds
        fetchSignal();
        setInterval(fetchSignal, 10000);
    </script>
</body>
</html>
